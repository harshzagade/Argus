name: ti-enriched-block
description: >
  Notification for critical alerts. The block step only runs when this
  playbook is bound to a specific rule (on_rule or the rule's playbook:
  field); on the severity-wide trigger it is notify-only, because severity
  alone does not prove the source IP is malicious.
on_severity: critical
steps:
  - action: notify
    target: server
    params:
      channel: soc
      message: "🛡️ TI-confirmed threat: {alert.title} on {hostname}. Severity: {alert.severity}. Auto-response triggered."
  - action: block_ip
    target: agent
    params:
      ip: "{entities.src_ip}"
